name: CI Banco

on:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-banco-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"

      - name: Install test dependencies
        run: pip install -r banco/requirements-dev.txt

      - name: Build and start containers
        run: docker compose up -d --build banco-db banco-api

      - name: Wait for API to be healthy
        run: |
          url=http://localhost:8001/health_check
          for attempt in $(seq 1 30); do
            if curl -fsS "$url" > /dev/null; then
              echo "healthy: $url"
              exit 0
            fi
            sleep 2
          done
          echo "not healthy after 60s: $url"
          exit 1

      - name: Run pytest (banco)
        run: |
          mkdir -p reports
          cd banco
          timeout 300 python -m pytest tests/ --junitxml=../reports/banco.xml

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop containers
        if: always()
        run: docker compose down -v

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          SERVICE_TITLE: "Banco CI"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not set; skipping notification"
            exit 0
          fi
          python3 - <<'PY' > payload.json
          import glob, json, os
          import xml.etree.ElementTree as ET

          total = failed = skipped = 0
          for path in glob.glob("reports/*.xml"):
              suite = ET.parse(path).getroot()
              suite = suite if suite.tag == "testsuite" else suite.find("testsuite")
              total += int(suite.get("tests", 0))
              failed += int(suite.get("failures", 0)) + int(suite.get("errors", 0))
              skipped += int(suite.get("skipped", 0))
          passed = total - failed - skipped

          ok = os.environ["JOB_STATUS"] == "success"
          message = os.environ["COMMIT_MESSAGE"].splitlines()[0][:200] if os.environ["COMMIT_MESSAGE"] else ""
          sha = os.environ["COMMIT_SHA"][:7]
          title = os.environ["SERVICE_TITLE"]
          embed = {
              "title": f"✅ {title} passed" if ok else f"❌ {title} failed",
              "url": os.environ["RUN_URL"],
              "color": 3066993 if ok else 15158332,
              "fields": [
                  {"name": "Green", "value": str(passed), "inline": True},
                  {"name": "Red", "value": str(failed), "inline": True},
                  {"name": "Skipped", "value": str(skipped), "inline": True},
                  {"name": "Branch", "value": os.environ["BRANCH"], "inline": True},
                  {"name": "Author", "value": os.environ["ACTOR"], "inline": True},
                  {"name": "Commit", "value": f"[`{sha}`]({os.environ['COMMIT_URL']}) {message}"},
                  {"name": "Run", "value": f"[Open GitHub Actions run]({os.environ['RUN_URL']})"},
              ],
          }
          print(json.dumps({"embeds": [embed]}))
          PY
          curl -fsS -H "Content-Type: application/json" -d @payload.json "$DISCORD_WEBHOOK_URL"
