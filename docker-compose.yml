services:

  db:
    build: ./database/.
    environment:
      POSTGRES_USER: bootcamp-nrv
      POSTGRES_PASSWORD: bootcamp-nrv
      POSTGRES_DB: banco-nrv-qitech
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bootcamp-nrv -d bootcamp-nrv"]
      interval: 3s
      timeout: 3s
      retries: 20

